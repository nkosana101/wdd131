<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazil – WDD 131 Place Page</title>
  <meta name="description" content="A responsive place page about Brazil featuring country data, weather, and a wind chill calculation.">
  <meta name="author" content="Nkosana Dlamini">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>
  <header>
    <h1>Brazil</h1>
  </header>

  <main>
    <picture class="hero">
      <source srcset="images/brazil-hero-small.webp" media="(max-width: 640px)">
      <source srcset="images/brazil-hero-large.webp" media="(min-width: 641px)">
      <img src="images/brazil-hero-large.webp"
           alt="Rio de Janeiro coastline with mountains in the background"
           width="1600" height="900">
    </picture>

    <section class="data">
      <h2>Data</h2>
      <ul>
        <li><span class="label">Area:</span> 8,515,767 km²</li>
        <li><span class="label">Population:</span> 214,326,223</li>
        <li><span class="label">Capital:</span> Brasília</li>
        <li><span class="label">Language:</span> Portuguese</li>
        <li><span class="label">Currency:</span> Real (BRL)</li>
        <li><span class="label">Time Zone:</span> UTC−03:00</li>
      </ul>
    </section>

    <section class="weather">
      <h2>Weather</h2>
      <img class="weather-icon" src="images/partly-cloudy.svg"
           alt="Partly cloudy" width="48" height="48">
      <ul>
        <li><span class="label">Temperature:</span> 8 °C</li>
        <li><span class="label">Conditions:</span> Partly Cloudy</li>
        <li><span class="label">Wind:</span> 10 km/h</li>
        <li><span class="label">Wind Chill:</span> <span id="windchill"></span></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Nkosana Dlamini · South Africa</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
