
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by rating a product and sharing your experience.">
    <meta name="author" content="Nkosana Dlamini">
    <title>Product Review Form - WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
        <p>Share your experience with us!</p>
    </header>

    <main>
        <form action="review.html" method="get">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <div>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">☆</label>
                        <span>1</span>
                    </div>

                    <div>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <label for="rating2">☆☆</label>
                        <span>2</span>
                    </div>

                    <div>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <label for="rating3">☆☆☆</label>
                        <span>3</span>
                    </div>

                    <div>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <label for="rating4">☆☆☆☆</label>
                        <span>4</span>
                    </div>

                    <div>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <label for="rating5">☆☆☆☆☆</label>
                        <span>5</span>
                    </div>
                </div>
            </fieldset>

            <label for="installationDate">Date of Installation</label>
            <input type="date" id="installationDate" name="installationDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <p class="hint">Select all that apply.</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">Written Review <span>(Optional)</span></label>
            <textarea id="writtenReview" name="writtenReview" rows="5"
                placeholder="Tell us about your experience..."></textarea>

            <label for="userName">Your Name <span>(Optional)</span></label>
            <input type="text" id="userName" name="userName"
                autocomplete="name" placeholder="Enter your name">

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Nkosana Dlamini | South Africa</p>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
