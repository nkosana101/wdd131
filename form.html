
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form for WDD 131 where users can rate a product, select useful features, provide a review, and submit their feedback.">
    <meta name="author" content="Nkosana Dlamini">
    <title>Product Review - WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <label for="rating1">☆</label>
                <input type="radio" id="rating1" name="rating" value="1" required>

                <label for="rating2">☆☆</label>
                <input type="radio" id="rating2" name="rating" value="2" required>

                <label for="rating3">☆☆☆</label>
                <input type="radio" id="rating3" name="rating" value="3" required>

                <label for="rating4">☆☆☆☆</label>
                <input type="radio" id="rating4" name="rating" value="4" required>

                <label for="rating5">☆☆☆☆☆</label>
                <input type="radio" id="rating5" name="rating" value="5" required>
            </fieldset>

            <label for="installationDate">Date of Installation</label>
            <input type="date" id="installationDate"
                name="installationDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <p>Select all that apply.</p>

                <label for="durability">
                    <input type="checkbox" id="durability"
                        name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease"
                        name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance"
                        name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design"
                        name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview"
                rows="5"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Nkosana Dlamini | South Africa</p>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
